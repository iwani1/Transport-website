name: Build site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run check

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          include-hidden-files: true

      # Optional automatic deployment to the cPanel host.
      # Add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD under Settings → Secrets to enable.
      - name: Deploy via FTP
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./_site/
          server-dir: ./public_html/
          exclude: |
            **/.git*
            **/.git*/**
